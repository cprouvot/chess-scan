version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chess-scan-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models
    restart: unless-stopped
    networks:
      - chess-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chess-scan-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - chess-net

networks:
  chess-net:
    driver: bridge
