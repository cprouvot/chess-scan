# Configuration Nginx pour Chess Scan

server {
    listen 80;
    listen [::]:80;
    server_name chess-scan.akabia.fr; # À remplacer par votre nom de domaine

    # Redirection HTTP vers HTTPS (à décommenter une fois SSL installé avec Certbot)
    # return 301 https://$host$request_uri;

    client_max_body_size 10M;

    # Emplacement du build frontend React
    root /var/www/chess-scan/frontend/dist;
    index index.html;

    # Support du routage SPA (React Router / Vite)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy Inverse pour l'API FastAPI
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sécurité supplémentaire
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";
}

